name: Database Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: database-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-database:
    name: Deploy database
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      TARGET_ENVIRONMENT: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate deployment configuration
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is required}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD is required}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF is required}"

      - name: Show target database environment
        run: echo "Deploying database migrations to $TARGET_ENVIRONMENT"

      - name: Link Supabase project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: pnpm db migrate up

      - name: Apply RLS policies (ephemeral migration)
        run: pnpm rls sync

      - name: Show migration status
        run: pnpm db migrate status

      - name: Validate database generated types
        run: |
          pnpm exec supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" \
            --schema public \
            > /tmp/database-generated.types.ts
          sed '/PostgrestVersion:/d' packages/db/src/database-generated.types.ts \
            > /tmp/database-generated.types.repo.ts
          sed '/PostgrestVersion:/d' /tmp/database-generated.types.ts \
            > /tmp/database-generated.types.normalized.ts
          diff -u \
            /tmp/database-generated.types.repo.ts \
            /tmp/database-generated.types.normalized.ts
